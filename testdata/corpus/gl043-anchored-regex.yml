# #700: an anchored pattern with an escaped slash is fine.
# #820: the namespace prefix ending in / is not reported; only the unrelated
# GL053 finding remains.
deploy:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/
  script:
    - ./deploy.sh
build:
  rules:
    - if: $CI_PROJECT_NAMESPACE =~ /^mygroup\//
  script: [make]
